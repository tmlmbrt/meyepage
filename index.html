<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <img id="cam" src="" alt="Camera image" />

  <script>
    const cameraUrl = "https://visitelizabethcity.com/camera/current.jpg";
    const cam = document.getElementById("cam");
    let refreshTimer = null;

    function randomDelayMs() {
      const min = 2 * 60 * 1000;
      const max = 10 * 60 * 1000;
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function loadImageAndScheduleNext() {
      cam.src = `${cameraUrl}?t=${Date.now()}`;
      if (refreshTimer) clearTimeout(refreshTimer);
      refreshTimer = setTimeout(loadImageAndScheduleNext, randomDelayMs());
    }

    cam.addEventListener("click", loadImageAndScheduleNext);

    loadImageAndScheduleNext();
  </script>
</body>
</html>
